<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spickzettel — German Grammar</title>
<meta name="theme-color" content="#0a0a0a">
<!--
  Spickzettel — the app's single grammar reference (A1 → B1).
  GENERATED FILE — do not edit by hand. Content lives in scripts/cheatsheet/content.py;
  rebuild with:  python3 scripts/cheatsheet/build.py public/cheatsheet.html
  Every topic is a <section class="blk"> of plain tables; search filters table ROWS,
  the sidebar indexes every topic, and the per-topic "sitzt" tick is kept in localStorage.
-->
<style>
/* Colours and type are the app's (src/config/theme.js, levels.js): the same
   near-black surfaces, the same der/die/das blue/pink/green, the same level
   colours and the same system font — so the Spickzettel reads as part of the
   app rather than a separate site. Keep the two in step. */
:root{
  color-scheme:dark;
  --paper:#0a0a0a; --surface:#141414; --surface-2:#1a1a1a;
  --ink:#e2e8f0; --ink-2:#9aa6b6; --ink-3:#8b94a3;
  --rule:#262626; --rule-2:#1f1f1f;
  --accent:#c084fc; --accent-soft:#a855f71f;
  --amber:#fbbf24; --amber-soft:#fbbf2426;
  --m:#60a5fa; --f:#f472b6; --n:#4ade80; --p:#a3a3a3;
  --m-bg:#3b82f61f; --f-bg:#ec48991f; --n-bg:#22c55e1f; --p-bg:#a3a3a31a;
  --nom:#a3a3a3; --nom-bg:#a3a3a31a; --akk:#e0a458; --akk-bg:#33260f;
  --dat:#6ecbd6; --dat-bg:#173238; --gen:#b4a2ee; --gen-bg:#241e3a;
  --a1:#22c55e; --a1-bg:#22c55e1f; --a2:#f97316; --a2-bg:#f973161f; --b1:#3b82f6; --b1-bg:#3b82f61f;
  --done:#22c55e; --done-bg:#0a2a16;
  --bar:58px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
/* never pan the whole page sideways: wide tables scroll inside .scroll */
html,body{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit}

/* ── top bar ── */
.bar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 16px;max-width:1440px;margin:0 auto}
.brand{font-weight:800;font-size:18px;letter-spacing:-.3px;margin-right:4px;white-space:nowrap}
.brand span{color:var(--accent)}
#q{flex:1 1 240px;min-width:0;background:var(--surface);border:1px solid var(--rule);color:var(--ink);
  border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
#q:focus{border-color:var(--accent)}
#q::placeholder{color:var(--ink-3)}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;font-weight:600;
  padding:6px 11px;border-radius:99px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-3);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.chip[data-lvl="A1"][aria-pressed="true"]{color:var(--a1);border-color:var(--a1);background:var(--a1-bg)}
.chip[data-lvl="A2"][aria-pressed="true"]{color:var(--a2);border-color:var(--a2);background:var(--a2-bg)}
.chip[data-lvl="B1"][aria-pressed="true"]{color:var(--b1);border-color:var(--b1);background:var(--b1-bg)}
#openonly[aria-pressed="true"]{color:var(--done);border-color:var(--done);background:var(--done-bg)}
.meta{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-3);white-space:nowrap}
.meta b{color:var(--done);font-weight:600}
#tocbtn{display:none}

/* ── layout ── */
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;max-width:1440px;margin:0 auto;padding:0 16px 80px}
nav.toc{position:sticky;top:calc(var(--bar) + 6px);align-self:start;max-height:calc(100vh - var(--bar) - 12px);
  overflow-y:auto;padding:14px 4px 24px 0;font-size:12.5px;scrollbar-width:thin}
.toc-sec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin:14px 8px 4px}
.toc-sec:first-child{margin-top:0}
nav.toc a{display:flex;align-items:baseline;gap:8px;padding:3px 8px;border-radius:5px;color:var(--ink-2);text-decoration:none;line-height:1.3}
nav.toc a:hover{background:var(--surface-2);color:var(--ink)}
nav.toc a.active{background:var(--accent-soft);color:var(--accent)}
nav.toc .no{font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--ink-3);min-width:16px;text-align:right}
nav.toc .tt{flex:1}
nav.toc .tick{color:var(--done);font-weight:700;visibility:hidden}
nav.toc a.done .tick{visibility:visible}
nav.toc a.done .tt{color:var(--ink-3)}
main{min-width:0}

/* ── sections & topics ── */
h1,h2,h3{margin:0;font-weight:700}
h2.sec{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
  margin:30px 0 0;padding:0 0 6px;border-bottom:2px solid var(--accent-soft);scroll-margin-top:calc(var(--bar) + 10px)}
h2.sec:first-child{margin-top:18px}
.blk{padding:14px 0 20px;border-bottom:1px solid var(--rule);scroll-margin-top:calc(var(--bar) + 10px)}
.bh{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.bh .no{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.bh h3{font-size:17px;font-weight:800;letter-spacing:-.2px;color:var(--ink)}
.bh .tags{font-size:12.5px;color:var(--ink-3)}
.lvl{font-size:10px;letter-spacing:.04em;font-weight:700;padding:1px 6px;border-radius:99px;border:1px solid currentColor}
.lvl.A1{color:var(--a1);background:var(--a1-bg)} .lvl.A2{color:var(--a2);background:var(--a2-bg)} .lvl.B1{color:var(--b1);background:var(--b1-bg)}
.done{margin-left:auto;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:99px;
  border:1px solid var(--rule);background:transparent;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.done::before{content:"○ "}
.done:hover{border-color:var(--done);color:var(--done)}
.done[aria-pressed="true"]{border-color:var(--done);background:var(--done-bg);color:var(--done)}
.done[aria-pressed="true"]::before{content:"✓ "}
.blk.is-done .bh h3{color:var(--ink-2)}

/* ── tables ── */
.tbls{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 18px;margin-top:10px}
.t{flex:0 1 auto;min-width:0;max-width:100%}
.t.full{flex:1 1 100%}
.cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 4px 2px}
.scroll{overflow-x:auto;overscroll-behavior-x:contain;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;font-size:13.5px}
.t.full table{width:100%}
th,td{padding:5px 10px;text-align:left;vertical-align:top;overflow-wrap:break-word;
  border-bottom:1px solid var(--rule-2);border-right:1px solid var(--rule-2)}
tr>*:last-child{border-right:0}
tbody tr:last-child>*{border-bottom:0}
thead th{background:var(--surface-2);font-size:12px;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--rule);line-height:1.3}
tbody th{background:var(--surface-2);font-weight:600;color:var(--ink)}
.w{min-width:190px}
b{font-weight:700}
.de{font-weight:600;color:var(--ink)}
.en{color:var(--ink-3);font-size:12px}
@media (hover:hover){tbody tr:hover>td,tbody tr:hover>th{background:var(--surface-2)}}
.g-m{color:var(--m)} .g-f{color:var(--f)} .g-n{color:var(--n)} .g-p{color:var(--p)}
th.h-m{color:var(--m);background:var(--m-bg)} th.h-f{color:var(--f);background:var(--f-bg)}
th.h-n{color:var(--n);background:var(--n-bg)} th.h-p{color:var(--p);background:var(--p-bg)}
th.c-nom{color:var(--nom);background:var(--nom-bg)} th.c-akk{color:var(--akk);background:var(--akk-bg)}
th.c-dat{color:var(--dat);background:var(--dat-bg)} th.c-gen{color:var(--gen);background:var(--gen-bg)}
.k-nom{color:var(--nom)} .k-akk{color:var(--akk)} .k-dat{color:var(--dat)} .k-gen{color:var(--gen)}
/* notes: one-line rules under the tables */
table.notes td{color:var(--ink-2);width:100%}
table.notes th{font-size:11.5px;font-weight:600;color:var(--accent);background:transparent;width:1%;white-space:nowrap}
table.notes tr.hack th{color:var(--amber)}
/* Stolperfallen */
table.wires td.bad{color:var(--f);text-decoration:line-through;text-decoration-thickness:1px}
table.wires td.good{color:var(--n)}
table.wires td.good b{text-decoration:underline;text-underline-offset:3px}
table.wires td.w{color:var(--ink-2)}
mark{background:var(--amber-soft);color:inherit;border-radius:3px;box-shadow:0 0 0 1px var(--amber)}

.empty{padding:40px 4px;color:var(--ink-3);text-align:center}
footer{margin-top:40px;font-size:12.5px;color:var(--ink-3)}
footer ul{margin:6px 0 0;padding-left:18px}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #tocbtn{display:inline-block}
  nav.toc{position:fixed;left:0;top:var(--bar);bottom:0;width:min(300px,86vw);max-height:none;z-index:25;
    background:var(--surface);border-right:1px solid var(--rule);padding:12px 8px 40px;
    transform:translateX(-102%);transition:transform .18s ease}
  body.toc-open nav.toc{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .done{margin-left:0}

  /* ── Tables fit the screen: no sideways scrolling ──
     Cells wrap at word boundaries; a table that still overflows its
     frame gets class "stack" from fit() below and each row becomes a card
     of label → value pairs. */
  .w{min-width:0}

  table.stack,table.stack tbody,table.stack tr,table.stack td,table.stack tbody th{display:block;width:auto}
  table.stack thead{display:none}
  /* cells size to their content and share each line; a long one takes a line of its own */
  table.stack tr{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
  table.stack tbody tr:last-child{border-bottom:0}
  table.stack tbody th{flex:1 1 100%;border-right:0;border-bottom:1px solid var(--rule-2);padding:6px 10px}
  table.stack td{flex:1 1 auto;min-width:25%;border-right:0;border-bottom:0;padding:5px 10px}
  table.stack td[data-label]::before{content:attr(data-label);display:block;font-size:10.5px;font-weight:600;
    color:var(--ink-3);letter-spacing:.02em;line-height:1.3}
  table.stack td.lab-m::before{color:var(--m)} table.stack td.lab-f::before{color:var(--f)}
  table.stack td.lab-n::before{color:var(--n)} table.stack td.lab-p::before{color:var(--p)}
  table.stack td.wide{flex-basis:100%}
  table.stack .lng{display:inline}
}
@media (max-width:560px){
  .bar-in{padding:8px 12px;gap:6px 8px} .layout{padding:0 12px 70px} .meta#hits{display:none}
  /* the app's header already names the page */
  .brand{display:none}
  /* 16px stops iOS zooming the page in when the search box is focused */
  /* row 1: contents button + search; row 2: the level chips */
  #q{font-size:16px;padding:7px 11px;flex:1 1 150px}
  .chips{flex:1 1 100%}
  .chip{padding:5px 10px}
  /* the sidebar ticks carry the same count; keep the bar to two rows */
  .meta#progress{display:none}

  .tbls{gap:14px}
  .t,.t.full{flex:1 1 100%}
  .t table{width:100%}
  table{font-size:13px}
  th,td{padding:5px 7px}
  .lng{display:none}
  thead th{font-size:11.5px}
  table.notes,table.notes tbody,table.notes tr,table.notes th,table.notes td{display:block;width:auto}
  table.notes th{border:0;padding:6px 10px 0;white-space:normal}
  table.notes tr{border-bottom:1px solid var(--rule-2)} table.notes tr:last-child{border-bottom:0}
}
@media print{
  :root{--paper:#fff;--surface:#fff;--surface-2:#f4f4f5;--ink:#111;--ink-2:#333;--ink-3:#555;
    --rule:#d4d4d8;--rule-2:#e4e4e7;--accent:#7e22ce;
    --m:#1d4ed8;--f:#be185d;--n:#15803d;--p:#525252;--m-bg:#fff;--f-bg:#fff;--n-bg:#fff;--p-bg:#fff;
    --nom:#525252;--akk:#b45309;--dat:#0e7490;--gen:#6d28d9;--nom-bg:#fff;--akk-bg:#fff;--dat-bg:#fff;--gen-bg:#fff}
  .bar,nav.toc,.done{display:none!important}
  .layout{display:block;padding:0}
  body{background:#fff;font-size:11px}
  .blk{break-inside:avoid-page}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>

<div class="bar" id="bar"><div class="bar-in">
  <button class="chip" id="tocbtn" type="button" aria-expanded="false">☰ Inhalt</button>
  <div class="brand">Spickzettel <span>DE</span></div>
  <input id="q" type="search" placeholder="Suchen — dativ, ins kino, weil, wäre, halb …  ( / )" autocomplete="off" spellcheck="false" aria-label="Suchen">
  <div class="chips" role="group" aria-label="Niveau">
    <button class="chip lv" data-lvl="all" aria-pressed="true">Alle</button>
    <button class="chip lv" data-lvl="A1" aria-pressed="false">A1</button>
    <button class="chip lv" data-lvl="A2" aria-pressed="false">A2</button>
    <button class="chip lv" data-lvl="B1" aria-pressed="false">B1</button>
    <button class="chip" id="openonly" aria-pressed="false" title="Nur Themen zeigen, die noch nicht sitzen">nur offen</button>
  </div>
  <span class="meta" id="progress"></span>
  <span class="meta" id="hits"></span>
</div></div>

<div class="layout">
<nav class="toc" id="toc" aria-label="Inhalt">
%%TOC%%
</nav>
<main id="main">
%%BODY%%
<div class="empty" id="empty" hidden>Nichts gefunden — versuch <span class="de">dativ</span>, <span class="de">perfekt</span>, <span class="de">weil</span>, <span class="de">plural</span>.</div>
<footer>
  Quellen: <a href="https://app.notion.com/p/umairkhawaja/German-Notes-3e4f11d2d821814a8b60d4de3c7f200f" target="_blank" rel="noopener">German Notes (Notion)</a> ·
  <a href="https://germanwithlaura.com/declension/" target="_blank" rel="noopener">German with Laura</a> ·
  <a href="https://www.schubert-verlag.de/aufgaben/uebungen_a1/a1_uebungen_index.htm" target="_blank" rel="noopener">Schubert-Verlag Übungen</a>
</footer>
</main>
</div>

<script>
(function(){
  var TOTAL = %%TOTAL%%;
  var KEY = 'spickzettel.done.v1';
  var q = document.getElementById('q');
  var hits = document.getElementById('hits');
  var progress = document.getElementById('progress');
  var empty = document.getElementById('empty');
  var bar = document.getElementById('bar');
  var tocbtn = document.getElementById('tocbtn');
  var openBtn = document.getElementById('openonly');
  var lvBtns = [].slice.call(document.querySelectorAll('.chip.lv'));
  var level = 'all', openOnly = false;

  function fold(s){
    return (s || '').toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss').replace(/\s+/g,' ');
  }

  // Index once: every topic, its tables and their rows, text pre-folded.
  var links = {};
  [].forEach.call(document.querySelectorAll('nav.toc a'), function(a){ links[a.dataset.for] = a; });
  var blocks = [].map.call(document.querySelectorAll('.blk'), function(b){
    return {
      el: b, id: b.id, lvl: b.dataset.lvl,
      head: fold(b.querySelector('.bh').textContent),
      btn: b.querySelector('.done'),
      tables: [].map.call(b.querySelectorAll('.t'), function(t){
        var cap = t.querySelector('.cap');
        return { el: t, cap: fold(cap ? cap.textContent : ''),
          rows: [].map.call(t.querySelectorAll('tbody tr'), function(r){
            return { el: r, txt: fold(r.textContent), lvl: r.dataset.lvl || '' };
          }) };
      })
    };
  });
  var secs = [].map.call(document.querySelectorAll('h2.sec'), function(h){
    var members = [], n = h.nextElementSibling;
    while (n && !n.matches('h2.sec')) { if (n.classList.contains('blk')) members.push(n); n = n.nextElementSibling; }
    return { el: h, members: members };
  });

  // ── "sitzt" tracking ──
  var done = {};
  try { (JSON.parse(localStorage.getItem(KEY)) || []).forEach(function(id){ done[id] = true; }); } catch(e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(Object.keys(done))); } catch(e) {} }
  function paintDone(){
    var c = 0;
    blocks.forEach(function(b){
      var d = !!done[b.id]; if (d) c++;
      b.btn.setAttribute('aria-pressed', String(d));
      b.el.classList.toggle('is-done', d);
      if (links[b.id]) links[b.id].classList.toggle('done', d);
    });
    progress.innerHTML = '<b>' + c + '</b>/' + TOTAL + ' sitzt';
  }
  blocks.forEach(function(b){
    b.btn.addEventListener('click', function(){
      if (done[b.id]) delete done[b.id]; else done[b.id] = true;
      save(); paintDone(); if (openOnly) apply();
    });
  });

  // ── highlighting ──
  var marked = [];
  function clearMarks(){
    marked.forEach(function(row){
      [].slice.call(row.querySelectorAll('mark')).forEach(function(m){ m.replaceWith(document.createTextNode(m.textContent)); });
      row.normalize();
    });
    marked = [];
  }
  function tokRx(t){
    return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ss/g,'(?:ss|ß)')
            .replace(/a/g,'[aä]').replace(/o/g,'[oö]').replace(/u/g,'[uü]');
  }
  function mark(row, rx){
    var w = document.createTreeWalker(row, NodeFilter.SHOW_TEXT, null), nodes = [], n;
    while ((n = w.nextNode())) nodes.push(n);
    var hit = false;
    nodes.forEach(function(node){
      var s = node.nodeValue; rx.lastIndex = 0;
      if (!rx.test(s)) return;
      rx.lastIndex = 0; hit = true;
      var frag = document.createDocumentFragment(), last = 0, m;
      while ((m = rx.exec(s))) {
        if (!m[0]) { rx.lastIndex++; continue; }
        frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        var mk = document.createElement('mark'); mk.textContent = m[0]; frag.appendChild(mk);
        last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(s.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
    if (hit) marked.push(row);
    return hit;
  }

  // ── filter: level + "nur offen" + search (row-level, all words must match) ──
  function apply(){
    clearMarks();
    var toks = fold(q.value).trim().split(' ').filter(Boolean);
    var rx = toks.length ? new RegExp(toks.map(tokRx).join('|'), 'gi') : null;
    var rowHits = 0, shownBlocks = 0;
    blocks.forEach(function(b){
      var ok = (level === 'all' || b.lvl === level || b.lvl === 'all') && !(openOnly && done[b.id]);
      var any = false;
      b.tables.forEach(function(t){
        var tv = 0;
        t.rows.forEach(function(r){
          var show = ok && (!r.lvl || level === 'all' || r.lvl === level);
          if (show && toks.length) {
            var hay = b.head + ' ' + t.cap + ' ' + r.txt;
            show = toks.every(function(k){ return hay.indexOf(k) !== -1; });
            if (show && mark(r.el, rx)) rowHits++;
          }
          r.el.hidden = !show; if (show) tv++;
        });
        t.el.hidden = tv === 0; if (tv) any = true;
      });
      b.el.hidden = !any; if (any) shownBlocks++;
      if (links[b.id]) links[b.id].hidden = !any;
    });
    secs.forEach(function(s){ s.el.hidden = !s.members.some(function(m){ return !m.hidden; }); });
    [].forEach.call(document.querySelectorAll('.toc-sec'), function(h){
      var n = h.nextElementSibling, vis = false;
      while (n && n.tagName === 'A') { if (!n.hidden) vis = true; n = n.nextElementSibling; }
      h.hidden = !vis;
    });
    hits.textContent = toks.length ? (rowHits + ' Treffer · ' + shownBlocks + ' Themen') : '';
    empty.hidden = shownBlocks !== 0;
    fit();
  }

  var timer;
  q.addEventListener('input', function(){ clearTimeout(timer); timer = setTimeout(apply, 80); });
  q.addEventListener('keydown', function(e){
    if (e.key === 'Escape') { q.value = ''; apply(); q.blur(); }
    if (e.key === 'Enter') {
      var first = document.querySelector('main mark') || blocks.map(function(b){ return b.el; }).filter(function(el){ return !el.hidden; })[0];
      if (first) first.scrollIntoView({ block: 'center' });
    }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
  });
  lvBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      level = btn.dataset.lvl;
      lvBtns.forEach(function(o){ o.setAttribute('aria-pressed', String(o === btn)); });
      apply();
    });
  });
  openBtn.addEventListener('click', function(){
    openOnly = !openOnly; openBtn.setAttribute('aria-pressed', String(openOnly)); apply();
  });

  // ── phone fit: a table that still overflows its frame becomes cards ──
  // Measured, not guessed, so it holds on any screen width. Runs after
  // every filter change too, because a hidden table measures as zero wide.
  var phone = window.matchMedia('(max-width:900px)');
  function fit(){
    [].forEach.call(document.querySelectorAll('table.stack'), function(t){ t.classList.remove('stack'); });
    if (!phone.matches) return;
    [].forEach.call(document.querySelectorAll('.scroll'), function(sc){
      var t = sc.querySelector('table');
      if (!t || t.classList.contains('notes') || !sc.clientWidth) return;
      if (sc.scrollWidth > sc.clientWidth + 1) t.classList.add('stack');
    });
  }
  var fitTimer;
  window.addEventListener('resize', function(){ clearTimeout(fitTimer); fitTimer = setTimeout(fit, 120); });

  // ── sidebar: drawer on narrow screens, scroll-spy everywhere ──
  function setBar(){ document.documentElement.style.setProperty('--bar', bar.offsetHeight + 'px'); }
  setBar(); window.addEventListener('resize', setBar);
  function closeToc(){ document.body.classList.remove('toc-open'); tocbtn.setAttribute('aria-expanded', 'false'); }
  tocbtn.addEventListener('click', function(){
    var open = document.body.classList.toggle('toc-open'); tocbtn.setAttribute('aria-expanded', String(open));
  });
  document.getElementById('toc').addEventListener('click', function(e){ if (e.target.closest('a')) closeToc(); });
  document.getElementById('main').addEventListener('click', closeToc);

  if ('IntersectionObserver' in window) {
    var active = null;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (!en.isIntersecting) return;
        var a = links[en.target.id]; if (!a || a === active) return;
        if (active) active.classList.remove('active');
        active = a; a.classList.add('active');
        var toc = document.getElementById('toc'), r = a.getBoundingClientRect(), tr = toc.getBoundingClientRect();
        if (r.top < tr.top || r.bottom > tr.bottom) toc.scrollTop += r.top - tr.top - tr.height / 3;
      });
    }, { rootMargin: '-90px 0px -65% 0px' });
    blocks.forEach(function(b){ io.observe(b.el); });
  }

  paintDone();
  fit();
})();
</script>
</body>
</html>
